<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tandem</title>
    <script>
      (function () {
        var DEFAULT_ACCENT = '#1d4ed8'
        function normalizeHex(value) {
          var s = String(value || '').trim()
          if (s.indexOf('#') !== 0) s = '#' + s
          if (/^#[0-9a-fA-F]{6}$/.test(s)) return s
          return DEFAULT_ACCENT
        }
        function hexToRgb(hex) {
          var num = parseInt(hex.trim().replace('#', ''), 16)
          return [(num >> 16) & 255, (num >> 8) & 255, num & 255]
        }
        function rgbToHsl(rgb) {
          var r = rgb[0] / 255
          var g = rgb[1] / 255
          var b = rgb[2] / 255
          var max = Math.max(r, g, b)
          var min = Math.min(r, g, b)
          var l = (max + min) / 2
          if (max === min) return [0, 0, l]
          var d = max - min
          var s = l > 0.5 ? d / (2 - max - min) : d / (max + min)
          var h = 0
          if (max === r) h = (g - b) / d + (g < b ? 6 : 0)
          else if (max === g) h = (b - r) / d + 2
          else h = (r - g) / d + 4
          return [((h * 60) % 360), s, l]
        }
        function hslToRgb(h, s, l) {
          var c = (1 - Math.abs(2 * l - 1)) * s
          var x = c * (1 - Math.abs(((h / 60) % 2) - 1))
          var m = l - c / 2
          var rgb
          if (h < 60) rgb = [c, x, 0]
          else if (h < 120) rgb = [x, c, 0]
          else if (h < 180) rgb = [0, c, x]
          else if (h < 240) rgb = [0, x, c]
          else if (h < 300) rgb = [x, 0, c]
          else rgb = [c, 0, x]
          return [
            Math.round((rgb[0] + m) * 255),
            Math.round((rgb[1] + m) * 255),
            Math.round((rgb[2] + m) * 255),
          ]
        }
        var lightness = {
          '50': function (l) { return l + (1 - l) * 0.8 },
          '400': function (l) { return l + (1 - l) * 0.4 },
          '500': function (l) { return l + (1 - l) * 0.25 },
          '600': function (l) { return l + (1 - l) * 0.12 },
          '700': function (l) { return l },
          '800': function (l) { return l * 0.6 },
        }
        var theme = localStorage.getItem('tandem_theme')
        if (theme === 'dark') {
          document.documentElement.classList.add('dark')
        } else if (theme === 'light') {
          document.documentElement.classList.remove('dark')
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark')
        }
        var accent = normalizeHex(localStorage.getItem('tandem_accent') || DEFAULT_ACCENT)
        var accentRgb = hexToRgb(accent)
        var accentHsl = rgbToHsl(accentRgb)
        var sat = Math.min(1, Math.max(0.55, accentHsl[1]))
        var style = document.documentElement.style
        for (var shade in lightness) {
          var shadeRgb = hslToRgb(accentHsl[0], sat, lightness[shade](accentHsl[2]))
          style.setProperty('--blue-' + shade, shadeRgb[0] + ' ' + shadeRgb[1] + ' ' + shadeRgb[2])
        }
        style.setProperty('--blue-700', accentRgb[0] + ' ' + accentRgb[1] + ' ' + accentRgb[2])
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
